<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renju Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</head>
<body>
    <div id="login-screen">
        <h1>Renju Lobby</h1>
        <input type="text" id="username" placeholder="Enter Username">
        <button id="login-btn">Login</button>
    </div>

    <div id="lobby-screen" style="display:none;">
        <h1>Lobby</h1>
        <div id="user-info">Logged in as: <span id="display-username"></span></div>

        <div id="create-room">
            <h3>Create Room</h3>
            <input type="text" id="room-name" placeholder="Room Name">
            <select id="game-type">
                <option value="pvp">Player vs Player</option>
                <option value="pvc">Player vs Computer</option>
            </select>
            <button id="create-room-btn">Create</button>
        </div>

        <h3>Existing Rooms</h3>
        <ul id="room-list"></ul>
    </div>

    <div id="game-screen" style="display:none;">
        <h1 id="room-title">Game Room</h1>
        <button id="leave-room-btn">Leave Room</button>
        <div class="game-container">
            <div id="board">
                <!-- Grid will be generated by JS -->
            </div>
            <div id="sidebar">
                <h3>Game Info</h3>
                <div id="game-status"></div>
                <h3>Move History</h3>
                <ul id="move-history"></ul>
            </div>
        </div>
    </div>
</body>
</html>
